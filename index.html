<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e88e5">
<title>はしって地図あつめ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<link rel="stylesheet" href="lib/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=20261117i">
</head>
<body>
<header id="top">
  <button id="btn-home" class="icon" aria-label="モード選択へ" title="モード選択へ" hidden>◀</button>
  <h1>はしって地図あつめ</h1>
  <button id="btn-music" class="icon" aria-label="音楽のオン・オフ" title="音楽">♪</button>
  <div id="counter" title="完成した数" hidden><b id="count-done">0</b> / <span id="count-total">47</span></div>
  <button id="btn-menu" class="icon" aria-label="メニュー">⋯</button>
  <div id="menu" hidden>
    <button id="menu-list">記録一覧（走った場所）</button>
    <button id="menu-export">記録を書き出す</button>
    <button id="menu-import">記録を読み込む</button>
    <button id="menu-reset" class="danger">すべて消す</button>
    <input type="file" id="file-import" accept="application/json" hidden>
  </div>
</header>

<main>
  <!-- 0. モード選択 -->
  <section id="screen-home" class="screen active">
    <h2 class="home-lead">どの地図を走る？</h2>
    <p class="home-sub">走った道が線になって、地図のピースが埋まっていきます。</p>
    <div id="home-cards"><p class="muted" style="padding:16px">読み込み中…（このまま変わらないときは Ctrl+F5 で再読み込みしてください）</p></div>
  </section>

  <!-- ① パズル盤 -->
  <section id="screen-board" class="screen">
    <div id="board-tools">
      <input id="search" type="search" list="search-list" autocomplete="off" placeholder="名前で探す">
      <datalist id="search-list"></datalist>
      <button id="z-out" aria-label="縮小">−</button><button id="z-in" aria-label="拡大">＋</button><button id="z-reset">全体</button>
    </div>
    <div id="board-wrap"><svg id="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="地図パズル"></svg></div>
    <p id="board-hint" class="muted">走りたい県をタップしてください</p>
  </section>

  <!-- ②③ コース作成・走行 -->
  <section id="screen-map" class="screen">
    <div id="map"></div>

    <div id="panel-plan" class="panel" hidden>
      <div class="row head"><button class="link" id="plan-back">← 戻る</button><b id="plan-title"></b></div>
      <div class="row opt size-row">
        <span class="lbl">大きさ</span>
        <div class="seg" id="size-seg">
          <button data-s="s">小</button><button data-s="m" class="on">中</button><button data-s="l">大</button>
        </div>
        <span id="plan-est" class="muted"></span>
      </div>
      <div class="opt here-row">
        <button id="btn-here">📍 現在地をスタートにする</button>
        <span class="muted">地図をタップして、好きな場所を指定することもできます</span>
      </div>
      <div class="row opt src-row">
        <label class="lbl" for="src">道路データ</label>
        <select id="src">
          <option value="osm">実際の道路（OpenStreetMap）</option>
          <option value="demo">デモ（疑似道路・ネット不要）</option>
        </select>
      </div>
      <button id="btn-draft" class="opt draft" hidden></button>
      <button id="btn-make" class="primary opt">コースを作る</button>
      <div id="plan-results" hidden>
        <div id="chips"></div>
        <div id="plan-info" class="muted"></div>
        <button id="btn-3d" type="button">🛰 3D・衛星で見る</button>
        <button id="btn-go" class="primary">このコースで走る</button>
      </div>
      <button class="link" id="btn-opts" hidden>← 条件を変える（大きさ・場所・道路）</button>
      <div id="plan-msg" class="msg"></div>
    </div>

    <div id="panel-run" class="panel" hidden>
      <div class="row head"><button class="link" id="run-back">← 戻る</button><b id="run-title"></b></div>
      <div class="stats">
        <div><small>距離</small><b id="st-dist">0.00 km</b></div>
        <div><small>時間</small><b id="st-time">0:00</b></div>
        <div><small>進み具合</small><b id="st-cov">0%</b></div>
      </div>
      <div id="run-status" class="status"></div>
      <div class="row sim">
        <label><input type="checkbox" id="sim"> シミュレーション走行（開発用）</label>
        <select id="sim-speed">
          <option value="12">ゆっくり</option><option value="40" selected>ふつう</option><option value="120">はやい</option>
        </select>
      </div>
      <div class="row">
        <button id="btn-nav" type="button">🧭 ナビ表示</button>
        <button id="btn-run" class="primary">スタート</button>
        <button id="btn-quit">やめる</button>
      </div>
      <div id="run-msg" class="msg"></div>
    </div>
  </section>
</main>

<!-- 県を選んだときの下からのシート -->
<div id="sheet" hidden>
  <div class="grab"></div>
  <div id="sheet-body"></div>
</div>

<!-- 完成・記録の表示 -->
<div id="modal" hidden>
  <div class="card" id="modal-card"></div>
</div>


<!-- コース作成中の大きなロード画面 -->
<div id="loading" hidden>
  <div class="ld-card">
    <div class="ld-top"><b id="ld-title">コースを作っています</b><button id="ld-cancel" class="link" type="button">やめる</button></div>
    <div id="loader-shape" aria-hidden="true"></div>
    <b id="loader-phase">準備中…</b>
    <button id="ld-open" class="primary" type="button" hidden>コースを見る</button>
    <div class="bar"><i></i></div>
    <span id="loader-pct" class="muted">0%</span>
    <div id="loader-tip" class="ld-tip" aria-live="polite"></div>
    <div class="ld-games">
      <div class="ld-game-tabs" role="tablist">
        <button type="button" data-g="jump">🏃 ジャンプ</button><button type="button" data-g="stop">🎯 ぴたっと</button><button type="button" data-g="mole">🐹 もぐら</button>
      </div>
      <p id="game-help" class="muted" hidden></p>
      <canvas id="game" hidden aria-label="ミニゲーム"></canvas>
    </div>
  </div>
</div>

<!-- 3D・衛星ビュー -->
<div id="view3d" hidden>
  <div id="map3d"></div>
  <div class="v3-bar">
    <button id="v3-close" class="icon" aria-label="とじる">✕</button>
    <div class="seg" id="v3-style"><button data-st="map" class="on">3D地図</button><button data-st="sat">衛星</button></div>
    <button id="v3-play" class="icon" aria-label="一周を再生">⏸</button>
  </div>
  <div id="v3-msg" class="v3-msg" hidden></div>
</div>

<!-- ナビ表示(進行方向が上の主観画面) -->
<div id="nav" hidden>
  <div id="nav-map"></div>
  <div class="nav-top"><span id="nav-arrow">⬆</span><b id="nav-text">まっすぐ進む</b></div>
  <div id="nav-status" class="status"></div>
  <div class="nav-bar">
    <div><small>のこり</small><b id="nav-left">-</b></div>
    <div><small>進み具合</small><b id="nav-cov">0%</b></div>
    <div><small id="nav-acc">GPS</small></div>
    <button id="nav-run" class="primary" type="button">スタート</button>
    <button id="nav-close" type="button">地図にもどる</button>
  </div>
</div>

<div id="toast" hidden></div>

<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('home-cards');
  if (el) el.innerHTML = '<p style="padding:16px;color:#b00020">エラー: ' + String(e.message).replace(/</g,'&lt;') + '<br>' + String(e.filename || '').split('/').pop() + ':' + e.lineno + '</p>';
});
</script>
<script src="lib/leaflet/leaflet.js"></script>
<script src="lib/maplibre/maplibre-gl.js"></script>
<script src="lib/maplibre/leaflet-maplibre-gl.js"></script>
<script src="js/music.js?v=20261117i"></script>
<script src="js/trivia.js?v=20261117i"></script>
<script src="js/game.js?v=20261117i"></script>
<script src="data/embedded.js?v=20261117i"></script>
<script src="js/route.js?v=20261117i"></script>
<script src="js/app.js?v=20261117i"></script>
</body>
</html>
